name: check-push-alerts

# 每3小時觸發一次check-alerts Edge Function，檢查訂閱門檻並發推播。
# anon key是設計上可公開的金鑰，Edge Function本身用SUPABASE_SERVICE_ROLE_KEY
# (由Supabase自動注入，未寫在任何檔案裡)做真正的資料庫存取。
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Call check-alerts function
        run: |
          curl -sf -X POST "https://ejqdyozjpewjwtnqohqd.supabase.co/functions/v1/check-alerts" \
            -H "Authorization: Bearer sb_publishable_mzkI2x9tbLELjcxK8q_ixQ_LElC_w4R" \
            -H "apikey: sb_publishable_mzkI2x9tbLELjcxK8q_ixQ_LElC_w4R" \
            -w "\nHTTP %{http_code}\n"
